[project]
name = "strata-tools"
version = "0.1.0"
description = "Python tooling for Strata: dataset conversion, benchmarks, RAG layer"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "h5py>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
